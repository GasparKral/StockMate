services:
  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_DB: stockmate
      POSTGRES_USER: stockmate
      POSTGRES_PASSWORD: stockmate_pass
      TZ: Europe/Madrid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stockmate" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./stockmate-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/stockmate
      DB_USERNAME: stockmate
      DB_PASSWORD: stockmate_pass
      JWT_SECRET: change-this-in-production
      TZ: Europe/Madrid
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./stockmate-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: 
