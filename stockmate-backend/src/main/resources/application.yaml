spring:
  application:
    name: stockmate-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockmate}
    username: ${DB_USERNAME:stockmate}
    password: ${DB_PASSWORD:stockmate_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # En producción/Docker usa validate, nunca create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: GPvoPDpQ5tJgwe7gVwomWIz1TV79v6sSdKlJRFwN5XXxslMs7h6DbJqzhEDAxGBS
    access-expiration: 28800000      # 15 min en ms
    refresh-expiration: 604800000  # 7 días en ms

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
